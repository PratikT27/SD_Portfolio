<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pratik Tambe — UI/UX Designer</title>
<meta name="description" content="Portfolio of Pratik Tambe: UI/UX and product thinking grounded in business and systems analysis.">
<meta name="theme-color" content="#F7F0E3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23F08A6C'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23F7F0E3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
<a class="skip" href="#panels">Skip to content</a>
<header class="nav" id="nav">
  <a class="brand" href="#top" data-bind="name"></a>
  <span class="avail"><i></i><span data-bind="availability"></span></span>
  <nav aria-label="Primary">
    <button data-open="projects">Selected Work</button>
    <button data-open="about">About</button>
    <button data-open="experience">Experience</button>
    <button data-open="contact">Contact</button>
  </nav>
</header>

<main id="top">
  <section class="hero" aria-labelledby="h1">
    <h1 id="h1"></h1>
    <div class="stickers" aria-hidden="true">
      <img class="s1" src="assets/images/laptop.svg" alt="">
      <img class="s2" src="assets/images/kanban.svg" alt="">
      <img class="s3" src="assets/images/desk.svg" alt="">
      <p class="note" data-bind="note"></p>
    </div>
    <div class="hero-meta">
      <p class="hero-name" data-bind="name"></p>
      <p class="hero-roles" data-bind="roles"></p>
      <p class="hero-sub" data-bind="tagline"></p>
      <a class="cta" href="#panels" data-bind="cta"></a>
    </div>
  </section>
  <div class="marquee" aria-hidden="true"><div class="mq-track" id="mq"></div></div>
  <div id="panels"></div>
</main>

<footer class="foot">
  <p class="foot-big" data-bind="closing"></p>
  <div class="foot-row">
    <a class="cta" id="foot-cta" href="#">Start a conversation</a>
    <div class="links" id="foot-links"></div>
    <button class="totop" id="totop">Back to top ↑</button>
  </div>
  <p class="copy">© <span id="year"></span> <span data-bind="name"></span></p>
</footer>

<div id="case" class="frame-case" role="dialog" aria-modal="true" aria-label="Project case study" hidden></div>

<script src="js/config.js?v=4"></script>
<script src="js/projects.js?v=4"></script>
<script src="js/main.js?v=4"></script>
</body>
</html>
