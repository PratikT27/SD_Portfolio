<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pratik Tambe — UI/UX Designer</title>
<meta name="description" content="Portfolio of Pratik Tambe: UI/UX and product thinking grounded in business and systems analysis.">
<meta name="theme-color" content="#0B0B0D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230B0B0D'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23C6FF3D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#panels">Skip to content</a>
<header class="nav" id="nav">
  <a class="brand" href="#top" data-bind="name"></a>
  <span class="avail"><i></i><span data-bind="availability"></span></span>
  <nav aria-label="Primary">
    <button data-open="projects">Selected Work</button>
    <button data-open="about">About</button>
    <button data-open="experience">Experience</button>
    <button data-open="contact">Contact</button>
  </nav>
</header>

<main id="top">
  <section class="hero" aria-labelledby="h1">
    <div class="orb" aria-hidden="true"></div>
    <h1 id="h1"></h1>
    <div class="hero-meta">
      <p class="hero-name" data-bind="name"></p>
      <p class="hero-roles" data-bind="roles"></p>
      <p class="hero-sub" data-bind="tagline"></p>
      <a class="cta" href="#panels" data-bind="cta"></a>
    </div>
  </section>
  <div id="panels"></div>
</main>

<footer class="foot">
  <p class="foot-big" data-bind="closing"></p>
  <div class="foot-row">
    <a class="cta" id="foot-cta" href="#">Start a conversation</a>
    <div class="links" id="foot-links"></div>
    <button class="totop" id="totop">Back to top ↑</button>
  </div>
  <p class="copy">© <span id="year"></span> <span data-bind="name"></span></p>
</footer>

<dialog id="case" aria-label="Project case study"></dialog>

<script src="js/config.js"></script>
<script src="js/projects.js"></script>
<script src="js/main.js"></script>
</body>
</html>
